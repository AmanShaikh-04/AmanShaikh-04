# Needs a repo secret METRICS_TOKEN:
# a classic personal access token with read:org, read:user and repo scopes.
name: Metrics
on:
  # Update daily
  schedule: [{cron: "0 23 * * *"}]
  # Run manually from the Actions tab
  workflow_dispatch:
  # Run on every push to main
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: AmanShaikh-04
          base: header, activity, repositories, metadata
          config_timezone: Asia/Kolkata
          repositories_skipped: AmanShaikh-04
          filename: github-metrics.svg
          optimize: svg
          experimental_features: --optimize-svg

          # 3D contribution calendar
          plugin_isocalendar: yes

          # Your pinned repositories
          plugin_pinned: yes
          plugin_pinned_limit: 6

          # Most used languages
          plugin_languages: yes
          plugin_languages_limit: 5

          # Lines of code added/removed
          plugin_lines: yes

          # Coding habits and facts
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_habits_languages_limit: 8
          plugin_habits_languages_threshold: 0%

          # Uncomment once you have a few stars on your repos
          # plugin_stargazers: yes
          # plugin_stargazers_charts_type: chartist
